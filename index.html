<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — 服裝設計作品集</title>
<link rel="icon" type="image/png" href="photos/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFFBF1; --paper:#FEFAF0; --paper-alt:#F9F8EF;
  --ink:#73161B; --ink-soft:#9E5D5D;
  --red:#EA5756; --teal:#6CC6CE; --teal-light:#CAE6E3;
  --line: rgba(115,22,27,0.15); --shadow: 0 18px 40px rgba(115,22,27,0.10); --radius: 2px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; background:var(--cream); color:var(--ink); font-family:'Jost',sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
h1,h2,h3,.display{font-family:'Cormorant Garamond',serif; font-weight:500; margin:0; letter-spacing:0.01em;}
.italic{font-style:italic;}
.eyebrow{font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.26em; text-transform:uppercase; color:var(--red); font-weight:500;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
img,svg{display:block; max-width:100%;}
img{font-size:0; color:transparent; object-fit:cover;}
img.img-broken{visibility:hidden; position:relative;}
img.img-broken::after{content:'圖片未載入'; visibility:visible; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-soft); background:var(--paper); letter-spacing:.05em; text-align:center; padding:8px;}
::selection{background:var(--red); color:var(--cream);}
.stitch{border:none; border-top:1.5px dashed var(--line); margin:0;}

/* ============ 導覽列 Nav ============ */
header.site-nav{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 40px;
  background:linear-gradient(to bottom, rgba(255,251,241,0.92), rgba(255,251,241,0));
  pointer-events:none;
}
header.site-nav.solid{background:rgba(255,251,241,0.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
.brand{
  pointer-events:auto; font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500;
  font-size:19px; letter-spacing:0.02em; display:flex; align-items:center; gap:8px;
}
.brand .mark{width:22px;height:22px;flex-shrink:0;}
.brand .caret{display:none; width:9px; height:9px; border-right:1px solid var(--ink); border-bottom:1px solid var(--ink); transform:rotate(45deg); transition:transform .3s ease; margin-left:2px;}
.brand.open .caret{transform:rotate(225deg);}
nav.pages{pointer-events:auto; display:flex; gap:20px;}
nav.pages a{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; font-weight:500; color:var(--ink-soft); position:relative; padding-bottom:4px; white-space:nowrap;}
nav.pages a.active{color:var(--red);}
nav.pages a.active::after{content:''; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:var(--teal);}

.mobile-dropdown{
  position:fixed; top:64px; left:20px; right:20px; z-index:150;
  background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow);
  display:none; flex-direction:column; padding:6px 0; pointer-events:auto;
}
.mobile-dropdown.open{display:flex; animation:fadeIn .25s ease;}
.mobile-dropdown a{padding:15px 22px; font-size:14px; letter-spacing:0.1em; border-bottom:1px solid var(--line); color:var(--ink-soft);}
.mobile-dropdown a:last-child{border-bottom:none;}
.mobile-dropdown a.active{color:var(--red);}
@media (min-width:901px){ .mobile-dropdown{display:none !important;} }

/* ============ 頁面容器 ============ */
.page{display:none; min-height:100vh;}
.page.active{display:block; animation:fadeIn .6s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.wrap{max-width:1180px; margin:0 auto; padding:0 40px;}
.section-pad{padding:120px 0 100px;}
footer.site-footer{padding:60px 40px 40px; text-align:center; border-top:1px solid var(--line); font-size:12px; letter-spacing:0.15em; color:var(--ink-soft); text-transform:uppercase;}
.placeholder-note{background:var(--paper); border:1px dashed var(--red); border-radius:var(--radius); padding:10px 16px; font-size:12px; color:var(--ink-soft); letter-spacing:0.03em; display:inline-flex; gap:8px; align-items:center;}

/* ============ 首頁 Hero Orbit（單純底色，摩天輪式公轉） ============ */
.hero{
  position:relative; height:100vh; min-height:680px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background: var(--cream);
}
.hero-title{position:absolute; z-index:5; text-align:center; pointer-events:none; display:flex; flex-direction:column; align-items:center;}
.hero-title .hero-name{font-family:'Jost',sans-serif; font-weight:300; font-size:clamp(10px,1.6vw,13px); letter-spacing:0.28em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:10px;}
.hero-title h1{font-size:clamp(30px,6vw,54px); font-style:italic; line-height:1.1; margin-bottom:8px;}
.hero-title .hero-date{font-family:'Jost',sans-serif; font-weight:300; font-size:clamp(9px,1.4vw,12px); letter-spacing:0.3em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:20px;}
.orbit-stage{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.orbit-ring{position:relative; width:min(90vw,80vh,600px); height:min(90vw,80vh,600px); border-radius:50%;}
.orbit-item{position:absolute; top:50%; left:50%; width:130px; height:130px; margin:-65px 0 0 -65px;}
.orbit-item .card{
  width:100%; height:100%; border-radius:50%; overflow:hidden; background:var(--paper);
  border:1px solid var(--line); box-shadow:var(--shadow); position:relative;
  padding:0;
  transition:transform .35s ease, box-shadow .35s ease;
}
.orbit-item .card:hover{transform:scale(1.12); box-shadow:0 20px 40px rgba(115,22,27,0.2); z-index:20;}
.orbit-item .card svg{width:100%;height:100%;padding:16px;}
.orbit-item .card img{width:100%;height:100%;object-fit:cover;}
.orbit-item .num{position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); font-size:10px; letter-spacing:0.1em; color:var(--ink-soft); white-space:nowrap;}
.scroll-cue{pointer-events:auto; z-index:5; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:8px;}
.scroll-cue .line{width:1px; height:34px; background:var(--line); position:relative; overflow:hidden;}
.scroll-cue .line::after{content:'';position:absolute; top:-100%; left:0; width:100%; height:100%; background:var(--red); animation:trickle 2.2s ease-in-out infinite;}
@keyframes trickle{0%{top:-100%;} 60%{top:100%;} 100%{top:100%;}}

.home-links{padding:100px 0 40px; text-align:center;}
.home-links .stitch{max-width:120px; margin:0 auto 40px;}
.home-links-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line);}
.home-links-grid a{background:var(--cream); padding:42px 20px; display:flex; flex-direction:column; gap:10px; align-items:center; transition:background .3s ease;}
.home-links-grid a:hover{background:var(--paper);}
.home-links-grid .eyebrow{font-size:11px;}
.home-links-grid h3{font-style:italic; font-size:22px;}
.home-links-grid-logo{background:var(--paper-alt); padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ink-soft); min-height:150px;}
.home-links-grid-logo .brand-logo-img{width:100%; height:100%; max-height:100px; object-fit:contain;}

/* ============ 通用頁首 ============ */
.page-hero{padding:150px 0 60px; text-align:center;}
.page-hero h2{font-size:clamp(30px,4.4vw,48px); font-style:italic;}
.page-hero p.lede{max-width:520px; margin:16px auto 0; color:var(--ink-soft); font-size:14px; line-height:1.8;}

/* ============ About ============ */
.about-center{max-width:640px; margin:0 auto; padding-bottom:60px;}
.about-header-row{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:40px;}
.about-heading{flex:1;}
.about-heading .eyebrow{margin-bottom:10px; display:block;}
.about-heading h2{font-size:36px; font-style:italic; margin-bottom:10px;}
.about-heading .about-title{font-size:13px; color:var(--ink-soft); letter-spacing:.05em; margin:0;}
.about-portrait{flex:0 0 auto; width:150px; aspect-ratio:3/4; background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.about-portrait svg{width:70%;}
.about-portrait img{width:100%; height:100%; object-fit:cover;}
.about-statement{text-align:justify;}
.about-statement p{font-size:15px; line-height:2; color:var(--ink-soft); margin:0 0 18px;}
.about-facts{margin-top:36px; display:grid; grid-template-columns:1fr 1fr; gap:22px 30px;}
.about-facts div h4{font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--red); font-weight:500; margin-bottom:8px;}
.about-facts div p{margin:0; font-size:14px; color:var(--ink); line-height:1.7;}
.about-contact{margin-top:40px; display:flex; gap:26px; flex-wrap:wrap;}
.about-contact a{font-size:12px; letter-spacing:0.1em; border-bottom:1px solid var(--ink); padding-bottom:2px;}

/* ============ 系列頁 Collection ============ */
.collection-intro{padding:150px 0 60px;}
.collection-intro .grid2{display:grid; grid-template-columns:1.1fr 0.9fr; gap:60px; align-items:end;}
.collection-intro h2{font-size:clamp(20px,4.4vw,30px); font-style:italic;}
.collection-intro p.lede{color:var(--ink-soft); font-size:14px; line-height:1.9; max-width:420px;}
.palette-strip{display:flex; gap:8px; margin-top:22px;}
.palette-strip span{width:26px; height:26px; border-radius:50%; border:1px solid rgba(0,0,0,0.08);}
.look-palette{display:flex; gap:6px; margin:6px 0 16px;}
.look-palette span{width:18px; height:18px; border-radius:50%; border:1px solid rgba(0,0,0,0.08);}

/* 每套服裝獨立區塊：圖片／文字＋合併縮圖列 */
.spotlight-wrap{margin-bottom:20px; border-top:1px solid var(--line);}
.spotlight-look{
  display:flex; flex-wrap:wrap; align-items:center; gap:60px;
  padding:70px 0; border-bottom:1px solid var(--line); position:relative;
}
.sp-visual{flex:0 0 442.09px; max-width:100%; position:relative; cursor:pointer; background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow); padding:30px; box-sizing:border-box;}
.sp-crop{width:381.43px; max-width:100%; aspect-ratio:3/4; overflow:hidden; position:relative; margin:0 auto;}
.sp-crop svg, .sp-crop img{position:absolute; width:100%; left:0; top:0; height:100%; object-fit:cover;}
.sp-crop.crop-full svg{top:0; height:100%; width:auto; margin:0 auto; position:relative; display:block; object-fit:contain;}
.sp-crop.crop-full img{position:relative; height:100%; width:auto; margin:0 auto; display:block; object-fit:contain;}
.sp-crop.crop-top svg, .sp-crop.crop-top img{top:0; transform:scale(1.55); transform-origin:top center;}
.sp-crop.crop-bottom svg, .sp-crop.crop-bottom img{bottom:0; top:auto; transform:scale(1.55); transform-origin:bottom center;}
.sp-crop.crop-acc{display:flex; align-items:center; justify-content:center;}
.sp-crop.crop-acc svg, .sp-crop.crop-acc img{position:relative; width:55%; height:auto;}
.sp-visual .zoom-hint{position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; background:rgba(254,250,240,0.92); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; opacity:0; transform:translateY(-6px); transition:all .3s ease; z-index:2;}
.sp-visual:hover .zoom-hint{opacity:1; transform:translateY(0);}

.sp-right{flex:1 1 380px; display:flex; flex-direction:column;}
.sp-copy{order:1;}
.sp-copy h3{font-size:30px; font-style:italic; margin:6px 0 16px;}
.sp-copy p{font-size:14px; line-height:2; color:var(--ink-soft); margin:0 0 16px;}
.sp-copy .fabric{font-size:11px; letter-spacing:.14em; color:var(--red); text-transform:uppercase; margin-bottom:20px;}

/* 合併縮圖列：套裝／上衣／下身／配件／手稿／棚拍照／靈感來源 一起排列 */
.sp-thumbs-all{order:2; margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;}
.sp-thumb{position:relative; width:52px; height:69px; border:1px solid var(--line); overflow:hidden; cursor:pointer; background:var(--paper); flex-shrink:0;}
.sp-thumb.active{border-color:var(--ink); box-shadow:0 0 0 1px var(--ink);}
.sp-thumb svg, .sp-thumb img{position:absolute; width:100%; left:0; top:0; height:100%; object-fit:cover;}
.sp-thumb.crop-full svg{top:0; height:100%; width:auto; margin:0 auto; position:relative; display:block;}
.sp-thumb.crop-full img{position:relative; height:100%; width:auto; margin:0 auto; display:block;}
.sp-thumb.crop-top svg, .sp-thumb.crop-top img{top:0; transform:scale(1.55); transform-origin:top center;}
.sp-thumb.crop-bottom svg, .sp-thumb.crop-bottom img{bottom:0; top:auto; transform:scale(1.55); transform-origin:bottom center;}
.sp-thumb.crop-acc{display:flex; align-items:center; justify-content:center;}
.sp-thumb.crop-acc svg, .sp-thumb.crop-acc img{position:relative; width:70%; height:auto;}
.sp-thumb .thumb-label{position:absolute; bottom:0; left:0; right:0; font-size:8px; text-align:center; background:rgba(254,250,240,0.85); padding:2px 0; letter-spacing:.03em; color:var(--ink-soft);}

.section-title{display:flex; align-items:baseline; gap:18px; margin:0 0 46px;}
.section-title .eyebrow{white-space:nowrap;}
.section-title .stitch{flex:1;}

/* ============ 排照 Lineup banner ============ */
.lineup-strip{display:flex; gap:2px; background:var(--paper); border:1px solid var(--line); overflow-x:auto; padding:24px 14px;}
.lineup-fig{flex:1 0 110px; display:flex; flex-direction:column; align-items:center; gap:8px;}
.lineup-fig svg{width:76px;}
.lineup-fig span{font-size:10px; letter-spacing:.1em; color:var(--ink-soft);}
.lineup-photo{width:100%; border:1px solid var(--line); background:var(--paper); overflow:hidden;}
.lineup-photo img{width:100%; display:block;}

/* ============ 影片 Video ============ */
.video-section{padding-bottom:60px;}
.video-wrap{display:flex; flex-direction:column; gap:26px;}
.video-frame{
  width:100%; aspect-ratio:16/9; background:var(--ink); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; cursor:pointer;
}
.video-frame iframe, .video-frame video{position:absolute; inset:0; width:100%; height:100%; border:0;}
.video-frame.portrait{width:100%; max-width:340px; aspect-ratio:9/16; margin:0 auto;}
.video-frame .play{width:64px; height:64px; border-radius:50%; border:1px solid rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center; z-index:1;}
.video-frame .play::after{content:''; border-style:solid; border-width:9px 0 9px 15px; border-color:transparent transparent transparent #fff; margin-left:4px;}
.video-frame .vcap{position:absolute; bottom:20px; left:22px; right:22px; color:rgba(255,255,255,0.75); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; z-index:1;}
.video-feature{display:flex; gap:50px; align-items:center;}
.video-feature .video-frame{flex:0 0 300px; margin:0;}
.video-feature-copy{flex:1;}
.video-feature-copy h3{font-size:24px; margin-bottom:14px;}
.video-feature-copy p{font-size:14px; line-height:2; color:var(--ink-soft); margin:0;}

/* ============ 品牌識別（個人品牌頁） ============ */
.brand-asset-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:2px; background:var(--line); border:1px solid var(--line); margin-bottom:10px;}
.brand-asset{background:var(--paper); padding:20px; display:flex; flex-direction:column; align-items:center; gap:14px;}
.brand-asset svg{width:80%;}
.cap-static{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}

/* ============ 概念與靈感（原民服飾頁） ============ */
.concept-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:50px; align-items:center; padding-bottom:20px;}
.concept-copy p{font-size:14px; line-height:2.1; color:var(--ink-soft); margin:0;}
.concept-visual{background:var(--paper); border:1px solid var(--line); aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;}
.concept-visual svg{width:75%;}

/* ============ Album（僅畢業製作） ============ */
.album{padding-bottom:100px; padding-top:20px;}
.album-grid{column-count:3; column-gap:14px;}
.album-item{break-inside:avoid; margin-bottom:14px; position:relative; cursor:pointer; overflow:hidden; border:1px solid var(--line); background:var(--paper);}
.album-item img, .album-item svg{width:100%; height:auto; display:block;}
.album-item .cap{position:absolute; bottom:0; left:0; right:0; padding:8px 10px; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; background:linear-gradient(to top, rgba(115,22,27,0.65), transparent); color:#fff; opacity:0; transition:opacity .3s ease;}
.album-item:hover .cap{opacity:1;}
.album-item.album-sketch{background:#FBF8F1;}
.album-item.album-brand{background:var(--paper);}
.album-item.album-fitting{background:var(--paper-alt);}
@media (max-width:900px){ .album-grid{column-count:2;} }
@media (max-width:520px){ .album-grid{column-count:1;} }

/* ============ 下一頁接續 ============ */
.chapter-nav{padding:60px 0 130px; text-align:center; border-top:1px solid var(--line);}
.chapter-nav a{display:inline-block;}
.chapter-nav a:hover h3{color:var(--red);}
.chapter-nav h3{font-size:26px; margin-top:6px;}

/* ============ 平面設計／其他單品 grid ============ */
.others-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:0; background:#FFFBF1; border:1px solid var(--line); margin-bottom:60px;}
.others-grid .look-card{background:var(--cream); position:relative; cursor:pointer; overflow:hidden; border-right:1px solid var(--line); border-bottom:1px solid var(--line);}
.others-grid .imgbox{background:var(--paper); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;}
.others-grid .imgbox svg{width:100%; transition:transform .5s ease;}
.others-grid .look-card:hover .imgbox svg{transform:scale(1.05);}
.others-grid .meta{padding:16px 18px 20px; border-top:1px solid var(--line);}
.others-grid .meta .eyebrow{font-size:10px;}
.others-grid .meta h3{font-size:19px; font-style:italic; margin-top:4px;}
.others-grid .zoom-hint{position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; background:rgba(254,250,240,0.9); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; opacity:0; transform:translateY(-6px); transition:all .3s ease;}
.others-grid .look-card:hover .zoom-hint{opacity:1; transform:translateY(0);}

/* ============ Lightbox（縮圖列在照片下方，不疊在照片上） ============ */
.lightbox{position:fixed; inset:0; z-index:1000; background:rgba(115,22,27,0.55); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:40px;}
.lightbox.open{display:flex; animation:fadeIn .3s ease;}
.lb-panel{background:var(--paper); max-width:920px; width:100%; max-height:88vh; overflow:auto; display:grid; grid-template-columns:1.1fr 1fr; box-shadow:0 30px 70px rgba(0,0,0,0.35); position:relative;}
.lb-visual{background:var(--cream); display:flex; flex-direction:column; padding:30px; position:relative; border-right:1px solid var(--line);}
.lb-crop{width:100%; aspect-ratio:3/4; overflow:hidden; position:relative;}
.lb-crop svg{position:absolute; width:100%; left:0;}
.lb-crop.crop-full svg{top:0; height:100%; width:auto; margin:0 auto; position:relative; display:block;}
.lb-crop.crop-top svg{top:0; transform:scale(1.55); transform-origin:top center;}
.lb-crop.crop-bottom svg{bottom:0; top:auto; transform:scale(1.55); transform-origin:bottom center;}
.lb-crop.crop-acc{display:flex; align-items:center; justify-content:center;}
.lb-crop.crop-acc svg{position:relative; width:55%;}
.lb-info{padding:38px 36px; display:flex; flex-direction:column;}
.lb-info .eyebrow{margin-bottom:8px;}
.lb-info h3{font-size:28px; font-style:italic;}
.lb-info .specs{padding-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft); display:grid; gap:6px; margin-bottom:18px;}
.lb-cta{display:inline-flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; border:1px solid var(--ink); padding:12px 20px;}
.lb-cta:hover{background:var(--ink); color:var(--paper);}
.lb-close{position:absolute; top:18px; right:18px; width:34px; height:34px; border-radius:50%; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; z-index:5;}
.lb-panel-lineup{background:var(--paper); max-width:960px; width:100%; max-height:88vh; overflow:auto; display:flex; flex-direction:column; box-shadow:0 30px 70px rgba(0,0,0,0.35); position:relative;}

var orbitAnim = { running: true, elapsed: 0, lastTs: null, raf: null, durationMs: 150000, hoverBound: false };
function startOrbit() {
  var ring = document.getElementById('orbitRing');
  if (!ring) return;
  var items = ring.querySelectorAll('.orbit-item');
  if (!items.length) return;
  var n = items.length;

  if (!orbitAnim.hoverBound) {
    var stage = document.querySelector('.orbit-stage');
    if (stage) {
      stage.addEventListener('mouseenter', function () { orbitAnim.running = false; });
      stage.addEventListener('mouseleave', function () { orbitAnim.running = true; });
      orbitAnim.hoverBound = true;
    }
  }
  if (orbitAnim.raf) cancelAnimationFrame(orbitAnim.raf);

  function frame(ts) {
    if (orbitAnim.lastTs === null) orbitAnim.lastTs = ts;
    var dt = ts - orbitAnim.lastTs;
    orbitAnim.lastTs = ts;
    if (orbitAnim.running) orbitAnim.elapsed += dt;
    var progress = (orbitAnim.elapsed % orbitAnim.durationMs) / orbitAnim.durationMs;
    var itemR = items[0].offsetWidth / 2;
    var R = ring.offsetWidth / 2 - itemR;
    items.forEach(function (el, i) {
      var angle = (i * (360 / n)) + progress * 360;
      var rad = angle * Math.PI / 180;
      var x = R * Math.cos(rad);
      var y = R * Math.sin(rad);
      el.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px)';
    });
    orbitAnim.raf = requestAnimationFrame(frame);
  }
  orbitAnim.raf = requestAnimationFrame(frame);
}

/* ---------------- 每套服裝：獨立區塊 Spotlight（圖片／文字＋合併縮圖列） ---------------- */
/* 若某套服裝有自訂的 entry.modes 陣列，直接使用該清單（順序、數量、名稱完全自訂）。
   沒有自訂 modes 時，才用下面兩個函式自動推算預設組合（一般服裝適用）。 */
function getGarmentModes(entry) {
  var m = [];
  if (!entry.noBodyShot) { m.push('full', 'top', 'bottom'); }
  if (entry.accType) m.push('accessory');
  return m;
}
function getExtraModes(entry) {
  var m = [];
  if (entry.hasSketch) m.push('sketch');
  var shots = entry.studioShots || 0;
  for (var i = 1; i <= shots; i++) m.push('studio' + i);
  if (entry.hasInspiration) m.push('inspiration');
  return m;
}
function getAllModes(entry) {
  if (entry.modes) return entry.modes;
  return getGarmentModes(entry).concat(getExtraModes(entry));
}

function thumbBtnHtml(l, m, activeMode) {
  var tv = visualFor(l, m);
  return '<button class="sp-thumb ' + tv.cropClass + (m === activeMode ? ' active' : '') + '" data-mode="' + m + '">' + tv.svg + '<span class="thumb-label">' + (l.modeLabels && l.modeLabels[m] ? l.modeLabels[m] : (MODE_LABEL[m] || m)) + '</span></button>';
}

function spotlightCardHtml(l) {
  var modes = getAllModes(l);
  var defaultMode = modes[0];
  var v = visualFor(l, defaultMode);
  var thumbs = modes.map(function (m) { return thumbBtnHtml(l, m, defaultMode); }).join('');

  return '' +
    '<div class="spotlight-look" data-look="' + l.id + '" data-mode="' + defaultMode + '"' + (l.brandAssets ? ' style="border-bottom:none;"' : '') + '>' +
      '<div class="sp-visual">' +
        '<div class="sp-crop ' + v.cropClass + '">' + v.svg + '</div>' +
        '<span class="zoom-hint">' + zoomIconSvg() + '</span>' +

}

/* ---------------- 影片 Video ---------------- */
function videoEmbedHtml(v) {
 if (v.youtube) {
    return '<iframe src="https://www.youtube.com/embed/' + v.youtube + '" title="' + (v.caption||'') + '" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%;height:100%;"></iframe>';

      var visual = im.img ? imgTag(im.img, im.caption) : graphicSvg(proj.style || 'poster', iIdx);
      return '<div class="look-card" data-project="' + proj.id + '" data-index="' + iIdx + '">' +
        '<div class="imgbox" style="aspect-ratio:1/1;">' + visual + '<span class="zoom-hint">' + zoomIconSvg() + '</span></div>' +
        '<div class="meta"><span class="eyebrow">' + (im.caption || proj.tag) + '</span></div>' +
        '</div>';
    }).join('');
    return '' +
      '<section><div class="wrap">' +
        '<div class="section-title"><span class="eyebrow">' + proj.tag + '</span><hr class="stitch"></div>' +
        '<h3 class="italic" style="font-size:26px;margin-bottom:6px;">' + proj.title + '</h3>' +
        '<p style="font-size:12px;color:var(--ink-soft);letter-spacing:.05em;margin-bottom:26px;">' + proj.medium + '</p>' +
        '<div class="others-grid">' + tiles + '</div>' +
      '</div></section>';
  }).join('');
  return '' +
    '<section class="page-hero"><div class="wrap">' +
      '<span class="eyebrow">Graphic Design</span>' +
      '<h2 class="italic">平面設計</h2>' +
      '<p class="lede">收錄使用 Photoshop、Illustrator 等軟體完成的平面設計作品，展現視覺傳達與排版設計能力。</p>' +
    '</div></section>' +
    sections +
    '<div class="wrap">' + chapterNav('graphic') + '</div>';
}

/* ---------------- 燈箱 Lightbox（純放大檢視，縮圖已移至頁面上） ---------------- */
var currentEntry = null, currentKind = null;
var MODE_LABEL = {
  full: '套裝', top: '上衣', bottom: '下身', accessory: '配件',
  full1: '套裝正面', full2: '套裝背面',
  top1: '上衣正面', top2: '上衣背面', bottom1: '下身正面', bottom2: '下身背面',
  accessory1: '配件01', accessory2: '配件02', accessory3: '配件03',
  sketch: '手稿', studio1: '棚拍照 01', studio2: '棚拍照 02', studio3: '棚拍照 03', studio4: '棚拍照 04',
  inspiration: '靈感來源'
};
/* 找不到對應標籤時（例如您自訂了全新的 key），縮圖與燈箱都會自動顯示該 key 本身，不會壞掉，
   但建議還是在這裡補上對應的中文標籤，顯示會更好看。 */

function visualFor(entry, mode) {
  if (entry.photos && entry.photos[mode]) {
      return { svg: imgTag(entry.photos[mode], entry.name + ' ' + (MODE_LABEL[mode] || mode)), cropClass: 'crop-full' };};
  if (mode.indexOf('accessory') === 0) return { svg: ACCESSORY[entry.accType](entry.c1, entry.c2, entry.acc), cropClass: 'crop-acc' };
  if (mode.indexOf('accessory') === 0) return { svg: ACCESSORY[entry.accType](entry.c1, entry.c2, entry.acc), cropClass: 'crop-acc' };
  if (mode === 'sketch') return { svg: sketchSvg(entry.acc), cropClass: 'crop-full' };
  if (mode === 'inspiration') return { svg: inspirationSvg([entry.c1, entry.c2, entry.acc]), cropClass: 'crop-full' };
  if (mode.indexOf('studio') === 0) return { svg: drawLook(entry), cropClass: 'crop-full' };
  if (mode.indexOf('top') === 0) return { svg: svgWrap(SIL[entry.sil](entry.c1, entry.c2, entry.acc)), cropClass: 'crop-top' };
  if (mode.indexOf('bottom') === 0) return { svg: svgWrap(SIL[entry.sil](entry.c1, entry.c2, entry.acc)), cropClass: 'crop-bottom' };
  return { svg: svgWrap(SIL[entry.sil](entry.c1, entry.c2, entry.acc)), cropClass: 'crop-full' };
}

function openImageOnlyLightbox(html) {
  document.getElementById('lightbox').innerHTML =
    '<div class="lb-panel lb-panel-imageonly">' +
      '<div class="lb-imageonly-visual">' + html + '</div>' +
      '<button class="lb-close" aria-label="close">' + closeIconSvg() + '</button>' +
    '</div>';
  var closeBtn = document.querySelector('.lb-close');
  if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
  document.getElementById('lightbox').classList.add('open');
}
function openLineupLightbox(key) {
  var c = COLLECTIONS[key];
  var looks = LOOKS.filter(function (l) { return l.collection === key; });
  var visual = c.lineupPhoto ? imgTag(c.lineupPhoto, c.title) :
    ('<div class="lineup-strip" style="border:none;">' + looks.map(function (l) { return '<div class="lineup-fig">' + drawLook(l) + '<span>Look ' + l.num + '</span></div>'; }).join('') + '</div>');
  document.getElementById('lightbox').innerHTML =
    '<div class="lb-panel-lineup">' +
      '<div class="lb-lineup-visual">' + visual + '</div>' +
      '<div class="lb-info"><span class="eyebrow">Lineup · ' + c.title + '</span><h3 class="italic">' + c.title + '</h3><p>' + c.lede + '</p><a href="#' + key + '" class="lb-cta" data-cta="1">前往 ' + c.title + ' 系列 →</a></div>' +
      '<button class="lb-close" aria-label="close">' + closeIconSvg() + '</button>' +
    '</div>';
  var closeBtn = document.querySelector('.lb-close');
  if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
  var cta = document.querySelector('.lb-cta');
  if (cta) cta.addEventListener('click', function () { closeLightbox(); });
  document.getElementById('lightbox').classList.add('open');
}
function openLightbox(kind, id, mode) {
  if (kind === 'album') { openAlbumLightbox(id); return; }
  if (kind === 'graphic') { openGraphicLightbox(id, mode); return; }
  var entry = LOOKS.filter(function (l) { return l.id === id; })[0];
  if (!entry) return;
  currentEntry = entry; currentKind = kind;
  renderLightbox(mode || getAllModes(entry)[0]);
  document.getElementById('lightbox').classList.add('open');
}

function renderLightbox(mode) {
  var entry = currentEntry;
  var v = visualFor(entry, mode);
  var num = 'Look ' + entry.num;
  var collLabel = COLLECTIONS[entry.collection].title;
  var fabricHtml = entry.fabric ? ('<div class="specs"><div>材質 / Fabric</div><div style="color:var(--ink);">' + entry.fabric + '</div></div>') : '';
  var ctaHtml = '<a href="#' + entry.collection + '" class="lb-cta" data-cta="1">前往 ' + collLabel + ' 系列 →</a>';

  document.getElementById('lightbox').innerHTML =
    '<div class="lb-panel">' +
      '<div class="lb-visual">' +
        '<div class="lb-crop ' + v.cropClass + '">' + v.svg + '</div>' +
      '</div>' +
      '<div class="lb-info">' +
        '<span class="eyebrow">' + num + ' · ' + collLabel + ' · ' + (entry.modeLabels && entry.modeLabels[mode] ? entry.modeLabels[mode] : (MODE_LABEL[mode] || mode)) + '</span>' +
        '<h3 class="italic">' + entry.name + '</h3>' +
        '<div style="margin-top:auto;">' + fabricHtml + ctaHtml + '</div>' +
      '</div>' +
      '<button class="lb-close" aria-label="close">' + closeIconSvg() + '</button>' +
    '</div>';

  var closeBtn = document.querySelector('.lb-close');
  if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
  var cta = document.querySelector('.lb-cta');
  if (cta) cta.addEventListener('click', function () { closeLightbox(); });
}

function openAlbumLightbox(id) {
  var found = null, coll = null;
  COLLECTION_KEYS.forEach(function (k) {
    if (!COLLECTIONS[k].album) return;
    COLLECTIONS[k].album.forEach(function (item) { if (item.id === id) { found = item; coll = COLLECTIONS[k]; } });
  });
  if (!found) return;
  var svg = albumVisual(found);
  document.getElementById('lightbox').innerHTML =
    '<div class="lb-panel lb-panel-album">' +
      '<div class="lb-visual"><div class="lb-crop crop-full">' + svg + '</div></div>' +
      '<div class="lb-info">' +
        '<span class="eyebrow">' + ALBUM_TYPE_LABEL[found.type] + ' · ' + coll.title + '</span>' +
        '<h3 class="italic">' + found.caption + '</h3>' +
        '<p>此區塊用來收錄設計手稿、品牌識別與模特兒定裝照，讓面試官看見完整的製作歷程，而不只是最終成品。</p>' +
      '</div>' +
      '<button class="lb-close" aria-label="close">' + closeIconSvg() + '</button>' +
    '</div>';
  var closeBtn = document.querySelector('.lb-close');
  if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
  document.getElementById('lightbox').classList.add('open');
}

var currentGraphicProject = null, currentGraphicIndex = 0;
function openGraphicLightbox(projectId, index) {
  var proj = GRAPHIC_PROJECTS.filter(function (p) { return p.id === projectId; })[0];
  if (!proj) return;
  currentGraphicProject = proj;
  currentGraphicIndex = index || 0;
  renderGraphicLightbox();
  document.getElementById('lightbox').classList.add('open');
}
function renderGraphicLightbox() {
  var proj = currentGraphicProject;
  var idx = currentGraphicIndex;
  var im = proj.images[idx];
  var visual = im.img ? imgTag(im.img, im.caption) : graphicSvg(proj.style || 'poster', idx);
  var navHtml = proj.images.length > 1 ?
    '<button class="lb-nav lb-nav-prev" aria-label="prev">‹</button><button class="lb-nav lb-nav-next" aria-label="next">›</button>' : '';
  document.getElementById('lightbox').innerHTML =
    '<div class="lb-panel lb-panel-album">' +
      '<div class="lb-visual"><div class="lb-crop crop-full">' + visual + '</div>' + navHtml + '</div>' +
      '<div class="lb-info"><span class="eyebrow">' + proj.tag + ' · ' + (idx + 1) + ' / ' + proj.images.length + '</span><h3 class="italic">' + proj.title + '</h3><p>' + (im.caption || proj.medium) + '</p></div>' +
      '<button class="lb-close" aria-label="close">' + closeIconSvg() + '</button>' +
    '</div>';
  var closeBtn = document.querySelector('.lb-close');
  if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
  var prevBtn = document.querySelector('.lb-nav-prev');
  if (prevBtn) prevBtn.addEventListener('click', function () { currentGraphicIndex = (currentGraphicIndex - 1 + proj.images.length) % proj.images.length; renderGraphicLightbox(); });
  var nextBtn = document.querySelector('.lb-nav-next');
  if (nextBtn) nextBtn.addEventListener('click', function () { currentGraphicIndex = (currentGraphicIndex + 1) % proj.images.length; renderGraphicLightbox(); });
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox').innerHTML = '';
}

/* ---------------- 頁面內嵌大圖：點縮圖切換顯示 ---------------- */
function updateSpotlightVisual(container, mode) {
  var id = container.getAttribute('data-look');
  var entry = LOOKS.filter(function (l) { return l.id === id; })[0];
  if (!entry) return;
  var v = visualFor(entry, mode);
  var cropEl = container.querySelector('.sp-crop');
  cropEl.className = 'sp-crop ' + v.cropClass;
  cropEl.innerHTML = v.svg;
  container.dataset.mode = mode;
  container.querySelectorAll('.sp-thumb').forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
  });
}

/* ---------------- 手機下拉選單（品牌 Logo 觸發） ---------------- */
function isMobileNav() { return window.innerWidth <= 900; }
function closeMobileDropdown() {
  var dd = document.getElementById('mobileDropdown');
  var brand = document.getElementById('brandToggle');
  if (dd) dd.classList.remove('open');
  if (brand) brand.classList.remove('open');
}
function toggleMobileDropdown() {
  var dd = document.getElementById('mobileDropdown');
  var brand = document.getElementById('brandToggle');
  dd.classList.toggle('open');
  brand.classList.toggle('open');
}

/* ---------------- 路由 Router ---------------- */
function mountApp() {
  var app = document.getElementById('app');
  app.innerHTML =
    '<div class="page" id="page-home">' + renderHome() + '</div>' +
    '<div class="page" id="page-about">' + renderAbout() + '</div>' +
    '<div class="page" id="page-ind">' + renderCollection('ind') + '</div>' +
    '<div class="page" id="page-brand">' + renderCollection('brand') + '</div>' +
    '<div class="page" id="page-show">' + renderCollection('show') + '</div>' +
    '<div class="page" id="page-grad">' + renderCollection('grad') + '</div>' +
    '<div class="page" id="page-collab">' + renderCollection('collab') + '</div>' +
    '<div class="page" id="page-graphic">' + renderGraphicDesign() + '</div>';

  var links = PAGES.map(function (p) { return '<a href="#' + p + '" data-page="' + p + '">' + PAGE_LABEL[p] + '</a>'; }).join('');
  document.getElementById('pagesNav').innerHTML = links;
  document.getElementById('mobileDropdown').innerHTML = links;
}

function router() {
  var hash = location.hash.replace('#', '') || 'home';
  if (PAGES.indexOf(hash) === -1) hash = 'home';
  document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
  var el = document.getElementById('page-' + hash);
  if (el) el.classList.add('active');
  document.querySelectorAll('#pagesNav a, #mobileDropdown a').forEach(function (a) {
    a.classList.toggle('active', a.getAttribute('data-page') === hash);
  });
  window.scrollTo(0, 0);
  closeMobileDropdown();
}

/* ---------------- 事件委派 Event delegation ---------------- */
document.addEventListener('click', function (e) {
  var brandToggle = e.target.closest ? e.target.closest('#brandToggle') : null;
  if (brandToggle) {
    if (isMobileNav()) { e.preventDefault(); toggleMobileDropdown(); }
    return;
  }

  var orbitCard = e.target.closest ? e.target.closest('.orbit-item .card') : null;
  if (orbitCard) {
    var lid = orbitCard.getAttribute('data-look');
    var lookEntry = LOOKS.filter(function (x) { return x.id === lid; })[0];
    if (lookEntry && HOME_LINEUP_COLLECTIONS.indexOf(lookEntry.collection) > -1) {
      openLineupLightbox(lookEntry.collection);
    } else {
      openLightbox('look', lid);
    }
    return;
  }

  var spThumb = e.target.closest ? e.target.closest('.sp-thumb') : null;
  if (spThumb) {
    var thumbContainer = spThumb.closest('.spotlight-look');
    updateSpotlightVisual(thumbContainer, spThumb.getAttribute('data-mode'));
    return;
  }

  var spVisual = e.target.closest ? e.target.closest('.sp-visual') : null;
  if (spVisual) {
    var visualContainer = spVisual.closest('.spotlight-look');
    openLightbox('look', visualContainer.getAttribute('data-look'), visualContainer.dataset.mode);
    return;
  }

  var albumItem = e.target.closest ? e.target.closest('.album-item[data-album]') : null;
  if (albumItem) {
  var avEl = albumItem.querySelector('svg, img');
  if (avEl) openImageOnlyLightbox(avEl.outerHTML);
  return;
  }

  var graphicCard = e.target.closest ? e.target.closest('.look-card[data-project]') : null;
  if (graphicCard) { openLightbox('graphic', graphicCard.getAttribute('data-project'), Number(graphicCard.getAttribute('data-index'))); return; }
  if (e.target.id === 'lightbox') { closeLightbox(); return; }

  var brandAsset = e.target.closest ? e.target.closest('.brand-asset') : null;
  if (brandAsset) {
  var visualEl = brandAsset.querySelector('svg, img');
  if (visualEl) openImageOnlyLightbox(visualEl.outerHTML);
  return; }
  });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeLightbox(); closeMobileDropdown(); }
});
window.addEventListener('scroll', function () {
  document.getElementById('siteNav').classList.toggle('solid', window.scrollY > 40);
});
window.addEventListener('hashchange', router);
window.addEventListener('resize', function () { closeMobileDropdown(); });

/* ---------------- 初始化 Init ---------------- */
mountApp();
router();
startOrbit();

</script>
</body>
</html>
